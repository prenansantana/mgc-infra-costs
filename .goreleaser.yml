version: 2

builds:
  - main: ./cmd/mgc-infra-costs
    binary: mgc-infra-costs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: ['tar.gz']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc

brews:
  - repository:
      owner: prenansantana
      name: homebrew-tap
    name: mgc-infra-costs
    homepage: "https://github.com/prenansantana/mgc-infra-costs"
    description: "Estimativa de custos de infraestrutura Magalu Cloud a partir de planos Terraform"
    license: "MIT"
    install: |
      bin.install "mgc-infra-costs"
    test: |
      system "#{bin}/mgc-infra-costs", "--version"
